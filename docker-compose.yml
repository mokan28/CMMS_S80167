services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [db]
    command: php artisan serve --host=0.0.0.0 --port=8000
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cmms
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: secret
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
volumes:
  pgdata:
